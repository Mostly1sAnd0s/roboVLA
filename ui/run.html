<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roboVLA — run</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<nav id="nav" hx-boost="true"></nav>
<main class="container">
  <div class="page-head">
    <h1 class="mono" id="jobid">run</h1>
    <span id="state"></span>
    <span class="muted small" id="eta"></span>
    <div class="actions" id="actions"></div>
  </div>

  <div class="metrics card" id="strip"></div>

  <div class="grid grid--2 mt3">
    <div class="card">
      <div class="card-head"><h2>Progress</h2>
        <span class="muted xs" id="losscap"></span></div>
      <div class="bar"><i id="pfill" style="width:0%"></i></div>
      <div class="xs muted mt2">train loss</div>
      <canvas id="loss" class="chart"></canvas>
      <div class="xs muted mt2">held-out accuracy (per checkpoint)</div>
      <canvas id="val" class="chart" style="--h:80px"></canvas>
      <div id="probe" class="small mt2"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Config</h2>
        <div class="actions"><a class="small" id="tklink" hidden
          href="#" target="_blank">ticket →</a></div></div>
      <div id="cfg" class="small mono"></div>
      <h2 class="mt3">Artifacts</h2>
      <div id="arts" class="small">—</div>
      <details open><summary>raw log (live)</summary>
        <pre id="log" class="log" style="--lmax:320px"></pre></details>
    </div>
  </div>
</main>
<script src="/ui/vendor/htmx.min.js"></script>
<script src="/ui/app.js"></script>
<script>
(async () => {
const user = await me();
if (!user) location.href = "/ui/login.html";
nav("", user);                       // run pages are not a nav destination
const job = new URLSearchParams(location.search).get("job");
if (!job) { location.href = "/ui/index.html"; return; }

const view = await api(`/api/runs/${job}`).catch(err => { toast(err.message, true); return; });
if (!view) return;
$("#jobid").textContent = job;
$("#cfg").innerHTML = `<div class="tablewrap"><table>
  <tr><td class="muted">type / student</td><td>${esc(view.job_type)} / ${esc(view.student)}</td></tr>
  <tr><td class="muted">dataset</td><td class="mono">${esc(view.dataset)}</td></tr>
  <tr><td class="muted">node</td><td>${esc(view.node_id ?? "auto")}</td></tr>
  <tr><td class="muted">quant / seed</td><td>${esc(view.config.quant)} / ${view.config.seed}</td></tr>
  <tr><td class="muted">lora</td><td>rank ${view.config.lora.rank} · α ${view.config.lora.alpha}</td></tr>
  <tr><td class="muted">optim</td><td>batch ${view.config.optim.batch} · lr ${view.config.optim.lr}
      · epochs ${view.config.optim.epochs}</td></tr>
  <tr><td class="muted">budget</td><td>${view.config.budget_gb} GB (estimate)</td></tr>
  ${view.note ? `<tr><td class="muted">note</td><td>${esc(view.note)}</td></tr>` : ""}
</table></div>`;
if (view.ticket_id) {
  const a = $("#tklink");
  a.hidden = false;
  a.href = `/api/runs/${job}/ticket`;
}

const STRIP = [["step", "step"], ["loss", "loss"], ["grad norm", "grad_norm"],
               ["lr", "lr"], ["VRAM", "vram_gb"], ["util", "gpu_util"]];
function paintStrip(m) {
  $("#strip").innerHTML = STRIP.map(([label, k]) => {
    let v = m[k];
    if (k === "step") v = m.step != null ? `${m.step}/${m.total ?? "?"}` : "—";
    else if (k === "loss" || k === "grad_norm") v = v != null ? Number(v).toFixed(4) : "—";
    else if (k === "vram_gb") v = v != null ? `${Number(v).toFixed(1)} GB` : "—";
    else if (k === "gpu_util") v = v != null ? `${Math.round(v * 100)}%` : "—";
    else v = v ?? "—";
    return `<div class="metric"><div class="k">${label}</div><div class="v small">${esc(String(v))}</div></div>`;
  }).join("");
}
paintStrip({});

function setState(v) {
  $("#state").innerHTML = badge(v.state);
  let eta = "";
  if (v.state === "queued") {
    eta = `position ${v.position} · ETA ${fmtEta(v.eta_s)}`;
    if (v.blockers) eta += ` · waiting: ` + v.blockers.map(b => `${b.node} (${b.reason})`).join(", ");
  }
  $("#eta").textContent = eta;
}
setState(view);

const losses = [], vals = [], logEl = $("#log");
const repaintLoss = () => spark($("#loss"), [{ color: "#4cc2ff", points: losses }]);
const repaintVal = () => spark($("#val"), [{ color: "#3fb950", points: vals }]);

if (["done", "failed", "killed"].includes(view.state)) {
  api(`/api/runs/${job}/logs?offset=0`).then(r => { logEl.textContent = r.log; }).catch(() => {});
}

if (["running", "queued", "finishing"].includes(view.state)) {
  sse(job, (type, d) => {
    if (type === "state") {
      setState({ state: d.state, position: d.position, eta_s: d.eta_s, blockers: d.blockers });
      if (["done", "failed", "killed"].includes(d.state)) { loadMeta(); loadArts(); }
    }
    if (type === "metrics") {
      if (d.loss != null) losses.push([d.step, d.loss]);
      paintStrip(d);
      const total = d.total ?? Math.max(...losses.map(p => p[0]), 1);
      $("#pfill").style.width = `${Math.min(100, (d.step / total) * 100).toFixed(1)}%`;
      repaintLoss();
      const last = lastPoint(losses);
      $("#losscap").textContent = last ? `step ${last[0]} · loss ${last[1].toFixed(4)}` : "";
    }
    if (type === "val") { vals.push([vals.length + 1, d.accuracy]); repaintVal(); }
    if (type === "log") { logEl.textContent += d.line + "\n"; logEl.scrollTop = logEl.scrollHeight; }
    if (type === "predict")
      $("#probe").innerHTML = `smoke probe action: <span class="mono">${
        d.action_norm.map(v => v.toFixed(2)).join(" ")}</span>`;
    if (type === "artifacts") loadArts();
  });
} else {
  // terminal run: seed the curves from the durable metric rows if present
  api(`/api/runs/${job}`).then(v => { if (v.progress) paintStrip(v.progress); });
}
repaintLoss(); repaintVal();

async function loadMeta() {
  const v = await api(`/api/runs/${job}`).catch(() => null);
  if (v) setState(v);
}
async function loadArts() {
  try {
    const { artifacts, downloadable } = await api(`/api/runs/${job}/artifacts`);
    $("#arts").innerHTML = artifacts.length
      ? `<div class="tablewrap"><table>${artifacts.map(a => `<tr>
          <td class="mono">${esc(a.kind)}</td>
          <td class="num muted">${fmtBytes(a.nbytes)}</td>
          <td class="right">${downloadable.includes(a.kind)
            ? `<a href="/api/runs/${job}/artifacts/${esc(a.kind)}" download>download</a>`
            : `<span class="muted xs">on the node</span>`}</td></tr>`).join("")}</table></div>`
      : "—";
  } catch { /* not ours / none yet */ }
}
loadArts();

const amOwner = user.role === "teacher" || view.student === user.user_id;
const canKill = user.role === "teacher"
  ? !["done", "failed", "killed"].includes(view.state)
  : view.state === "queued";
if (amOwner && canKill) {
  $("#actions").innerHTML = `<button class="danger" id="kill">kill</button>`;
  $("#kill").addEventListener("click", async () => {
    if (!await confirmAction({ title: `Kill ${job}?`, danger: true,
        body: "The job gets SIGTERM then SIGKILL; checkpoints already written are kept.",
        okLabel: "Kill run" })) return;
    try {
      await api(`/api/runs/${job}/kill`, { method: "POST" });
      toast("kill requested");
      setState({ state: "killed" });
    } catch (err) { toast(err.message, true); }
  });
}
})();
</script>
</body>
</html>
