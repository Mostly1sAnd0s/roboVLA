<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roboVLA console — log in</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<main class="container container--narrow" style="padding-top:12vh">
  <h1>roboVLA training console</h1>
  <p class="muted small">Class lab instrument — 12 students, 1 robot each.</p>
  <form id="f" class="card mt4">
    <div class="field"><label for="u">Username</label>
      <input id="u" autocomplete="username" autofocus required></div>
    <div class="field"><label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" required></div>
    <button type="submit" class="block">Log in</button>
    <p id="err" class="small err-text mb0" role="alert"></p>
  </form>
</main>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("u").value,
        password: document.getElementById("p").value,
      }),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      // the §9.6 error shape: {"error": {"code", "message"}}
      throw new Error(d.error ? d.error.message : `HTTP ${r.status}`);
    }
    location.href = "/ui/index.html";
  } catch (e2) {
    err.textContent = e2.message;
  }
});
</script>
</body>
</html>
