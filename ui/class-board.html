<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roboVLA — class board</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<nav id="nav" hx-boost="true"></nav>
<main class="container">
  <div class="page-head">
    <h1>Class board</h1>
    <span class="muted small">the whole class at a glance</span>
    <div class="actions"><button class="secondary" onclick="window.print()">print</button></div>
  </div>
  <div class="metrics card" id="summary"></div>
  <div class="grid mt3">
    <div class="card">
      <div class="card-head"><h2>Queue (all students, live)</h2></div>
      <div class="tablewrap"><table id="queue"><thead><tr>
        <th>job</th><th>student</th><th>type</th><th>state</th><th>pos</th><th>ETA</th>
      </tr></thead><tbody></tbody></table></div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="card-head"><h2>Inference slots</h2></div>
        <div class="tablewrap"><table id="slots"><thead><tr>
          <th>slot job</th><th>student</th><th>run</th><th>state</th><th>pos</th>
        </tr></thead><tbody></tbody></table></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Nodes</h2></div>
        <div id="nodes" class="small"></div>
      </div>
    </div>
  </div>
  <div class="card mt3" id="allcard">
    <div class="card-head"><h2>All runs</h2></div>
    <div class="tablewrap"><table id="all"><thead><tr>
      <th>job</th><th>student</th><th>type</th><th>dataset</th><th>state</th><th>node</th><th>submitted</th>
    </tr></thead><tbody></tbody></table></div>
  </div>
</main>
<script src="/ui/vendor/htmx.min.js"></script>
<script src="/ui/app.js"></script>
<script>
(async () => {
const user = await me();
if (!user) location.href = "/ui/login.html";
nav("class-board.html", user);
const isTeacher = user.role === "teacher";
if (!isTeacher) $("#allcard").style.display = "none";

async function load() {
  const [q, h, slots] = await Promise.all([
    api("/api/runs/queue"), api("/api/health"), api("/api/infer/slots"),
  ]);
  const running = q.queue.filter(j => j.state === "running").length;
  const queued = q.queue.filter(j => j.state === "queued").length;
  $("#summary").innerHTML = [
    ["running", running], ["queued", queued],
    ["maintenance", h.service.maintenance ? "ON" : "off"],
  ].map(([k, v]) => `<div class="metric"><div class="k">${k}</div>
      <div class="v">${esc(String(v))}</div></div>`).join("");

  $("#queue tbody").innerHTML = q.queue.map(j => `<tr>
      <td><a class="mono small" href="/ui/run.html?job=${esc(j.job_id)}">${esc(j.job_id)}</a></td>
      <td>${esc(j.student)}</td><td>${esc(j.job_type)}</td>
      <td>${badge(j.state)}</td>
      <td>${j.state === "queued" ? j.position : "—"}</td>
      <td>${j.state === "queued" ? fmtEta(j.eta_s) : "—"}</td></tr>`).join("")
    || `<tr><td colspan="6" class="muted">queue is empty</td></tr>`;

  $("#slots tbody").innerHTML = slots.slots.map(s => `<tr>
      <td class="mono small">${esc(s.job_id)}</td>
      <td>${esc(s.student)}</td>
      <td class="mono small">${s.run_id ? esc(s.run_id) : "—"}</td>
      <td>${badge(s.state)}</td>
      <td>${s.state === "queued" ? s.position : "—"}</td></tr>`).join("")
    || `<tr><td colspan="5" class="muted">no slots claimed</td></tr>`;

  $("#nodes").innerHTML = h.nodes.map(n =>
    `<div class="row" style="padding:3px 0"><span class="grow">${badge(n.online ? "online" : "offline")}
     <b>${esc(n.label ?? n.id)}</b></span>
     <span class="muted small">${n.free_gb != null ? n.free_gb.toFixed(1) : "?"}/${n.vram_gb} GB free
     · queue ${n.queue_depth}</span></div>`).join("")
    || `<div class="empty">no nodes in the fleet</div>`;

  if (isTeacher) {
    const { runs } = await api("/api/runs");
    $("#all tbody").innerHTML = runs.map(j => `<tr>
        <td><a class="mono small" href="/ui/run.html?job=${esc(j.job_id)}">${esc(j.job_id)}</a></td>
        <td>${esc(j.student)}</td><td>${esc(j.job_type)}</td>
        <td class="muted small">${esc(j.dataset)}</td>
        <td>${badge(j.state)}</td>
        <td class="muted">${esc(j.node_id ?? "auto")}</td>
        <td class="muted small">${fmtTs(j.created_at)}</td></tr>`).join("")
      || `<tr><td colspan="7" class="muted">no runs yet</td></tr>`;
  }
}
load().catch(err => toast(err.message, true));
poll(load, 10000);
})();
</script>
</body>
</html>
